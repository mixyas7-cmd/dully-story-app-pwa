
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dully Story App</title>

  <meta name="description"
    content="Karibu Dully Story App. Soma simulizi na hadithi mbalimbali.">

  <meta name="theme-color" content="#050816">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dully Story">

  <link rel="manifest"
    href="/dully-story-app-pwa/manifest.json">

  <link rel="icon" type="image/png"
    href="/dully-story-app-pwa/icons/icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
    }

    #blog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #installScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      color: #fff;
      background:
        radial-gradient(circle at top, #18264b 0%, transparent 45%),
        #050816;
      transition: opacity .5s ease, visibility .5s ease;
    }

    #installScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 25px;
      margin-bottom: 22px;
      box-shadow: 0 0 35px rgba(80, 130, 255, .2);
    }

    .app-title {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .app-subtitle {
      color: #b8c1d9;
      font-size: 14px;
      line-height: 1.7;
      max-width: 300px;
      margin-bottom: 30px;
    }

    #installButton {
      width: 100%;
      max-width: 290px;
      padding: 16px 20px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(100deg, #246bff, #713cff);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: glow 2s infinite;
    }

    #installButton::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
      );
      animation: shine 2s infinite;
    }

    @keyframes shine {
      100% { left: 140%; }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 10px rgba(65,110,255,.2);
      }
      50% {
        box-shadow: 0 0 25px rgba(65,110,255,.6);
      }
    }

    #statusMessage {
      color: #aeb9d5;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 18px;
      max-width: 290px;
    }

    .brand-footer {
      position: absolute;
      bottom: 25px;
      color: #65708c;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <!-- Blogger website -->
  <iframe
    id="blog"
    src="https://dullystoryapp.blogspot.com/"
    title="Dully Story App"
    allow="fullscreen"
    loading="eager">
  </iframe>

  <!-- App installation screen -->
  <div id="installScreen">

    <img
      class="app-logo"
      src="/dully-story-app-pwa/icons/icon-512.png"
      alt="Dully Story App Logo">

    <div class="app-title">DULLY STORY APP</div>

    <p class="app-subtitle">
      Karibu kwenye ulimwengu wa simulizi.
      Soma hadithi mbalimbali na furahia
      makala kupitia Dully Story App.
    </p>

    <button id="installButton">
      PAKUA DULLY STORY APP
    </button>

    <p id="statusMessage">
      Bonyeza kitufe hapo juu ili kusakinisha app.
    </p>

    <div class="brand-footer">
      POWERED BY OFFICIAL DULLY
    </div>

  </div>

  <script>
    let deferredPrompt = null;

    const installButton =
      document.getElementById("installButton");

    const installScreen =
      document.getElementById("installScreen");

    const statusMessage =
      document.getElementById("statusMessage");

    // Register service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register(
            "/dully-story-app-pwa/service-worker.js",
            { scope: "/dully-story-app-pwa/" }
          );
          console.log("Dully Story service worker registered");
        } catch (error) {
          console.error("Service worker error:", error);
        }
      });
    }

    // Receive Chrome installation event
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;

      installButton.textContent =
        "PAKUA DULLY STORY APP";

      statusMessage.textContent =
        "App iko tayari kusakinishwa kwenye simu yako.";
    });

    // Install button
    installButton.addEventListener("click", async () => {

      if (deferredPrompt) {
        deferredPrompt.prompt();

        const choice = await deferredPrompt.userChoice;

        if (choice.outcome === "accepted") {
          statusMessage.textContent =
            "Asante! Umeanza kusakinisha Dully Story App.";
        } else {
          statusMessage.textContent =
            "Usakinishaji haujakamilika. Unaweza kujaribu tena.";
        }

        deferredPrompt = null;
        return;
      }

      statusMessage.textContent =
        "Ikiwa Chrome inaonyesha chaguo la Install app au Add to Home screen, litumie kusakinisha app.";
    });

    // Hide installer after successful installation
    window.addEventListener("appinstalled", () => {
      installScreen.classList.add("hidden");
    });

    // If already opened as an installed app, hide installer
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (isStandalone) {
      installScreen.classList.add("hidden");
    }
  </script>

</body>
  </html>
